# ─────────────────────────────────────────────────────────────
# 公共配置：所有环境共享；环境差异一律放在 application-{profile}.yaml
# ─────────────────────────────────────────────────────────────
spring:
  application:
    name: Demo
  threads:
    virtual:
      enabled: true           # Tomcat 请求线程 + applicationTaskExecutor 使用虚拟线程
  jpa:
    hibernate:
      ddl-auto: validate      # 表结构由 Flyway 管理，Hibernate 只校验，不允许改表
    open-in-view: false       # 关闭 OSIV：懒加载必须在事务内完成，避免连接被视图层长期占用
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # 集合批量抓取：DTO 转换会访问 Order.items / User.roles，避免列表查询退化成 N+1
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  compression:
    enabled: true
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics     # 仅暴露必要端点，其余保持默认关闭
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Boot 4 + Java 25 业务架构示例

demo:
  security:
    jwt:
      # iss 声明必须是合法 URL（Spring Security 按 URL 校验签发者）
      issuer: ${JWT_ISSUER:https://demo.example.com}
      ttl: 1h
      # 留空时由进程生成随机密钥（仅本地开发，重启后旧令牌失效）；生产必须注入强随机值
      secret: ${JWT_SECRET:}
    allow-h2-console: false              # 默认关闭，仅 dev/test 打开
    allow-registration: false            # 默认关闭，仅 dev/test 打开（生产必须保持关闭）
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: false                       # 演示账号默认不创建

logging:
  level:
    root: INFO
