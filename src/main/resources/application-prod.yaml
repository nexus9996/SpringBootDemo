# ─────────────────────────────────────────────────────────────
# 生产环境：PostgreSQL + Flyway 管理表结构，凭据全部来自环境变量
# 必填环境变量：DB_USER / DB_PASSWORD / JWT_SECRET
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demo}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1800000
  jpa:
    show-sql: false

server:
  forward-headers-strategy: framework    # 部署在网关/负载均衡后，正确解析 X-Forwarded-*

springdoc:
  api-docs:
    enabled: false                       # 生产不暴露接口文档
  swagger-ui:
    enabled: false

demo:
  security:
    jwt:
      secret: ${JWT_SECRET}              # 未注入则启动失败（快速失败，优于带着空密钥运行）
    allow-h2-console: false
    allow-registration: false            # 生产关闭开放注册，账号由管理端创建
  seed:
    enabled: false

logging:
  level:
    root: INFO
    com.example.demo: INFO
