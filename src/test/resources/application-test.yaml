# ─────────────────────────────────────────────────────────────
# 测试环境：H2 内存库 + Flyway 建表（与生产同一套迁移脚本，保证 DDL 被持续验证）
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:demo-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.example.demo: INFO
    org.hibernate.SQL: WARN

demo:
  security:
    jwt:
      secret: test-only-secret-value-long-enough-for-hs256-32bytes+
      ttl: 1h
    allow-h2-console: false
    allow-registration: true
  seed:
    enabled: true
